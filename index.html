<style>
  :root { --mist: #F4F4F1; --sage: #718462; }
  * { box-sizing: border-box; }
  html { background: var(--sage); }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: 2rem 1rem;
    background: var(--sage);
    color: var(--mist);
    font-family: "Newsreader", Georgia, "Times New Roman", serif;
    -webkit-font-smoothing: antialiased;
  }
  main { display: flex; flex-direction: column; align-items: center; text-align: center; }
  img { display: block; width: min(30rem, 78vw); height: auto; }
  /* Large text: mist on sage is 3.7:1, which passes for text this size, not for body copy. */
  p {
    margin: clamp(1.5rem, 4vh, 2.5rem) 0 0;
    font-size: clamp(1.5rem, 1.1rem + 1.4vw, 2.25rem);
    font-style: italic;
    font-weight: 300;
    letter-spacing: .01em;
  }
  @media (prefers-reduced-motion: no-preference) {
    main { animation: arrive 1.2s ease-out both; }
    @keyframes arrive { from { opacity: 0; } to { opacity: 1; } }
  }
</style>
