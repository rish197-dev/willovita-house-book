<title>Willovita Operations</title>

<style>
:root{--bg:#eef0e9;--surface:#f9faf6;--ink:#20241b;--muted:#646f57;--line:#d6dbc9;--accent:#5c6e42;--accent-ink:#fff;--brass:#a4822f;--crit:#a8402e;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--bg:#14170f;--surface:#1d2116;--ink:#eaeee0;--muted:#a1ab8e;--line:#333a26;--accent:#9db27b;--accent-ink:#12180a;--brass:#cfa955;--crit:#e0806a;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "DM Sans",system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px))}
form{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:28px 24px;display:flex;flex-direction:column;gap:16px;text-align:center}
img{width:120px;height:auto;margin:0 auto;background:#fff;border-radius:8px;padding:6px}
.tag{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--brass);font-weight:700}
h1{font:600 28px/1.1 "Cormorant Garamond",Georgia,serif;margin:4px 0 0}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);text-align:left}
input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:10px;width:100%}
button{background:var(--accent);color:var(--accent-ink);border:0;border-radius:4px;padding:11px 16px;font:inherit;font-weight:700;cursor:pointer}
button[disabled]{opacity:.6;cursor:wait}
button.alt{background:none;color:var(--muted);font-weight:400;text-decoration:underline;padding:4px}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.msg{font-size:13px;min-height:1.3em;color:var(--crit)}
.msg.busy{color:var(--muted)}
</style>
</head>

var KEY='hb-key';
function u8(b){var s=atob(b),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}
function b64(buf){var a=new Uint8Array(buf),s='';for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s);}
function open(key){
  return crypto.subtle.decrypt({name:'AES-GCM',iv:u8(P.i)},key,u8(P.c)).then(function(buf){
    var html=new TextDecoder().decode(buf);
    document.open();document.write(html);document.close();
  });
}
var msg=document.getElementById('msg'),btn=document.getElementById('go'),pw=document.getElementById('pw');
var ES={'Private preview':'Vista privada','Password':'Contraseña','Enter':'Entrar','Unlocking...':'Abriendo...','That password is not right. Try again.':'La contraseña no es correcta. Inténtalo de nuevo.','This browser cannot unlock the page. Open it over https in a current browser.':'Este navegador no puede abrir la página. Ábrela con https en un navegador actualizado.'};
var es=false;try{var sl=localStorage.getItem('hb-lang');es=sl?sl==='es':/^es/i.test(navigator.language||'');}catch(e){es=/^es/i.test(navigator.language||'');}
function t(x){return es&&ES[x]?ES[x]:x;}
function paint(){document.documentElement.lang=es?'es':'en';document.getElementById('tg').textContent=t('Private preview');document.getElementById('lp').textContent=t('Password');btn.textContent=t('Enter');document.getElementById('lg').textContent=es?'English':'Español';}
document.getElementById('lg').addEventListener('click',function(){es=!es;try{localStorage.setItem('hb-lang',es?'es':'en');}catch(e){}msg.textContent='';paint();});
paint();
if(!(window.crypto&&crypto.subtle)){msg.textContent=t('This browser cannot unlock the page. Open it over https in a current browser.');btn.disabled=true;return;}
try{var saved=sessionStorage.getItem(KEY);
  if(saved){crypto.subtle.importKey('raw',u8(saved),'AES-GCM',true,['decrypt']).then(open).catch(function(){try{sessionStorage.removeItem(KEY);}catch(e){}});}
}catch(e){}
document.getElementById('f').addEventListener('submit',function(e){
  e.preventDefault();btn.disabled=true;msg.className='msg busy';msg.textContent=t('Unlocking...');
  crypto.subtle.importKey('raw',new TextEncoder().encode(pw.value),'PBKDF2',false,['deriveKey']).then(function(base){
    return crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(P.s),iterations:P.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt']);
  }).then(function(key){
    return crypto.subtle.decrypt({name:'AES-GCM',iv:u8(P.i)},key,u8(P.c)).then(function(){
      return crypto.subtle.exportKey('raw',key).then(function(raw){try{sessionStorage.setItem(KEY,b64(raw));}catch(x){}return key;});
    });
  }).then(open).catch(function(){
    btn.disabled=false;msg.className='msg';msg.textContent=t('That password is not right. Try again.');pw.value='';pw.focus();
  });
});
